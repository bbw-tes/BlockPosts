services:
  gui_db:
    image: phpmyadmin:latest
    environment:
      PMA_Host: blogpostdb
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - 8081:80
    depends_on:
      - blogpostdb
    networks:
      - blognet


  blogpostdb:
    image: mariadb:latest
    environment:
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - 3307:3306
    networks:
      - blognet

  blogpostapp:
    build: .
    depends_on:
      - blogpostdb
    environment:
      DB_HOST: blogpostdb
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: blogpostdb
    ports:
      - 8070:8080
    networks:
      - blognet

volumes:
  db-data:

networks:
  blognet:
    driver: bridge
